name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build .\Aion2Meter.slnx --configuration Release --nologo

      - name: Package self-contained release
        shell: pwsh
        run: .\scripts\publish.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: Aion2Meter-win-x64
          path: |
            artifacts/release/Aion2Meter-win-x64.zip
            artifacts/release/Aion2Meter-win-x64.zip.sha256

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/release/Aion2Meter-win-x64.zip
            artifacts/release/Aion2Meter-win-x64.zip.sha256
